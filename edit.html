
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense - PyAnalytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #243b55;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #243b55;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Expense</h1>

    <form method="POST">

        <label>Category</label>

        <input
            type="text"
            name="category"
            value="{{ expense[1] }}"
            required
        >

        <label>Description</label>

        <input
            type="text"
            name="description"
            value="{{ expense[2] }}"
            required
        >

        <label>Amount</label>

        <input
            type="number"
            name="amount"
            value="{{ expense[3] }}"
            step="0.01"
            min="0.01"
            required
        >

        <label>Expense Date</label>

        <input
            type="date"
            name="expense_date"
            value="{{ expense[4] or '' }}"
            required
        >

        <button type="submit">Update Expense</button>

    </form>

    <a href="/">Back to Dashboard</a>

</div>

</body>
</html>
